name: HopTales
options:
  bundleIdPrefix: com.hoptales
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "27.0"
  groupSortPosition: top
  minimumXcodeGenVersion: "2.44.0"

settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 8J5E74LNJY
    VERSIONING_SYSTEM: apple-generic

packages:
  HopTalesPackage:
    path: HopTalesPackage

targets:
  HopTales:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: HopTales
        excludes:
          - Info.plist
    dependencies:
      - package: HopTalesPackage
        product: AppFeature
    preBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          # Warnings in the issue navigator while you work. The commit hook is what blocks.
          # Xcode does not inherit the shell's PATH, so a Homebrew swiftlint is invisible here
          # until we go looking for it. Without this the build phase warns that swiftlint is
          # missing on CI, where ci_post_clone.sh has just installed it.
          for directory in /opt/homebrew/bin /usr/local/bin; do
            if [ -x "$directory/swiftlint" ]; then
              PATH="$directory:$PATH"
              break
            fi
          done
          if command -v swiftlint >/dev/null; then
            swiftlint lint --quiet
          else
            echo "warning: swiftlint is not installed — brew install swiftlint"
          fi
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HopTales/Info.plist
        MARKETING_VERSION: "0.1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.hoptales.ios
        PRODUCT_NAME: HopTales
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  HopTales:
    build:
      targets:
        HopTales: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: HopTalesPackage/AppFeatureTests
        - package: HopTalesPackage/ContentTests
        - package: HopTalesPackage/ReadingTests
        - package: HopTalesPackage/SnapshotTests
        - package: HopTalesPackage/SpeechTests

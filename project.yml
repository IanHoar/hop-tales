name: Wordhop
options:
  bundleIdPrefix: com.ianhoar
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "27.0"
  groupSortPosition: top
  minimumXcodeGenVersion: "2.44.0"

settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_VERSION: "6.0"
    # Set when the paid membership is active — see docs/xcode-cloud.md, step 0.
    DEVELOPMENT_TEAM: ""
    VERSIONING_SYSTEM: apple-generic

packages:
  WordhopPackage:
    path: WordhopPackage

targets:
  Wordhop:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Wordhop
        excludes:
          - Info.plist
    dependencies:
      - package: WordhopPackage
        product: AppFeature
    preBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          # Warnings in the issue navigator while you work. The commit hook is what blocks.
          if command -v swiftlint >/dev/null; then
            swiftlint lint --quiet
          else
            echo "warning: swiftlint is not installed — brew install swiftlint"
          fi
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Wordhop/Info.plist
        MARKETING_VERSION: "0.1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.ianhoar.wordhop
        PRODUCT_NAME: Wordhop
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  Wordhop:
    build:
      targets:
        Wordhop: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: WordhopPackage/AppFeatureTests
        - package: WordhopPackage/ReadingTests
        - package: WordhopPackage/SnapshotTests
        - package: WordhopPackage/SpeechTests

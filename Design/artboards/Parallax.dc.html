.px-near { animation: pxNear 48s linear infinite alternate; }

.px-grade-fg { animation: pxGradeFg 48s linear infinite alternate; }

@keyframes pxHop { from { transform: translateY(0px); } to { transform: translateY(-26px); } }
@keyframes pxBob { from { transform: translateY(0px); } to { transform: translateY(-4px); } }

}
</style>

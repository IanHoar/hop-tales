      <path d="M-20 -36 C -70 -80 -120 -120 -140 -150"/>
      <path d="M-20 -36 C -70 -66 -120 -96 -150 -112"/>
    </g>

    <!-- tail -->
    <path d="M60 8 C 100 26 130 20 150 4" stroke="url(#bodyStroke)" stroke-width="28" stroke-linecap="round" fill="none"/>
    <path d="M150 4 C 168 -12 186 -24 200 -26" stroke="#5E4399" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M200 -26 C 210 -28 218 -24 222 -18" stroke="#5E4399" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M218 -22 C 222 -46 242 -56 256 -40 C 250 -22 238 -10 218 -22 Z" fill="url(#belly)"/><path d="M220 -24 C 228 -36 240 -44 250 -40" stroke="#FFE3A0" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- hind leg -->

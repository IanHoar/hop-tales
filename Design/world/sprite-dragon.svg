    <!-- near wing -->
    <path d="M10 -36 C 30 -90 80 -140 130 -170 Q 140 -136 170 -130 Q 156 -102 180 -80 Q 152 -62 150 -40 Q 80 -34 10 -36 Z" fill="url(#wingNear)"/>
    <path d="M10 -36 C 30 -90 80 -140 130 -170 C 110 -150 90 -120 70 -90 C 50 -62 30 -46 10 -36 Z" fill="#C0A4F5" opacity="0.28"/>
    <g stroke="#3F2C6E" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M10 -36 C 30 -90 80 -140 130 -170"/>
      <path d="M10 -36 C 60 -80 120 -110 170 -130"/>
      <path d="M10 -36 C 60 -60 130 -74 180 -80"/>
      <path d="M10 -36 C 60 -44 110 -42 150 -40"/>
    </g>
    <g stroke="#D9C8FA" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.55">
      <path d="M14 -40 C 34 -92 84 -140 128 -168"/>
      <path d="M14 -38 C 62 -82 120 -110 166 -128"/>
    </g>
    <!-- shoulder -->
    <ellipse cx="14" cy="-30" rx="18" ry="12" fill="#7150B8"/>
  </g>
</svg>

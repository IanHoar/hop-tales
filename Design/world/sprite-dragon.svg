      <path d="M-184 -58 l2.5 -5 l2.5 5 Z"/><path d="M-174 -58 l2.5 -5 l2.5 5 Z"/>
    </g>
    <circle cx="-182" cy="-92" r="2" fill="#2E1F4C"/>
    <path d="M-160 -100 C -154 -104 -146 -104 -140 -100" stroke="#3F2C6E" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <ellipse cx="-150" cy="-93" rx="7" ry="6" fill="#FFE9A8"/>
    <circle cx="-151" cy="-93" r="2.8" fill="#2E1F4C"/>
    <circle cx="-152.5" cy="-95.5" r="1.1" fill="#FFFFFF"/>
    <path d="M-128 -108 C -128 -126 -116 -140 -100 -142 C -108 -130 -114 -118 -116 -104 Z" fill="url(#horn)"/>
    <path d="M-142 -110 C -144 -124 -138 -134 -130 -138 C -132 -128 -134 -118 -134 -108 Z" fill="url(#horn)"/>
    <path d="M-118 -80 C -116 -86 -114 -90 -114 -96" stroke="#E9A23B" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>

    <path d="M-166 -104 C -156 -110 -142 -110 -130 -104" stroke="#BDA3F2" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.5"/>
    <!-- spine spikes -->
    <g fill="url(#belly)">
      <path d="M-106 -94 L-100 -110 L-92 -96 Z"/>
      <path d="M-88 -66 L-84 -84 L-74 -70 Z"/>
      <path d="M-66 -44 L-62 -62 L-52 -48 Z"/>
      <path d="M-40 -36 L-34 -56 L-24 -40 Z"/>
      <path d="M-8 -40 L-2 -60 L8 -44 Z"/>
      <path d="M24 -38 L30 -56 L40 -40 Z"/>
      <path d="M54 -28 L60 -44 L68 -30 Z"/>
      <path d="M86 8 L94 -8 L100 8 Z"/>
      <path d="M122 6 L130 -8 L136 6 Z"/>
      <path d="M156 -12 L164 -28 L170 -16 Z"/>

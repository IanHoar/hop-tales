    <path d="M-20 -36 C -50 -96 -90 -150 -100 -186 Q -130 -160 -140 -150 Q -150 -128 -150 -112 Q -100 -70 -20 -36 Z" fill="url(#wingFar)"/>
    <g stroke="#26193F" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9">

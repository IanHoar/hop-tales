    <ellipse cx="-138" cy="-88" rx="32" ry="24" fill="url(#dragonBody)"/>
    <rect x="-192" y="-100" width="58" height="26" rx="13" fill="url(#dragonBody)"/>
    <path d="M-144 -76 C -160 -68 -178 -66 -192 -70 L -186 -56 C -170 -56 -156 -60 -144 -68 Z" fill="#5A3F9C"/>
    <path d="M-158 -72 C -168 -68 -178 -68 -186 -70" stroke="#E9A23B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <g fill="#FFF1B8">

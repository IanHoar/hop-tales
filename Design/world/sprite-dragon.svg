    <path d="M40 60 L28 66 M40 60 L38 70 M40 60 L50 66" stroke="#FFE3A0" stroke-width="4" stroke-linecap="round"/>
    <!-- front leg -->
    <path d="M-34 24 C -40 36 -42 46 -40 56" stroke="#553B94" stroke-width="13" stroke-linecap="round" fill="none"/>
    <path d="M-40 56 L-52 62 M-40 56 L-42 66 M-40 56 L-30 62" stroke="#FFE3A0" stroke-width="4" stroke-linecap="round"/>

    <!-- neck -->

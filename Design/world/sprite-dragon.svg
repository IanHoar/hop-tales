<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="-300 -230 640 420">
  <defs>
    <radialGradient id="dragonBody" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#9C7CE0"/>
      <stop offset="0.55" stop-color="#7150B8"/>
      <stop offset="1" stop-color="#4A3282"/>
    </radialGradient>
    <linearGradient id="bodyStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A68D0"/>
      <stop offset="1" stop-color="#553B94"/>
    </linearGradient>
    <linearGradient id="wingNear" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5A3F9C"/>
      <stop offset="0.45" stop-color="#7A5AC4"/>
      <stop offset="1" stop-color="#B08CF0" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="wingFar" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#33244F"/>
      <stop offset="1" stop-color="#5A4488"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6C25C"/>
      <stop offset="1" stop-color="#C98A2C"/>

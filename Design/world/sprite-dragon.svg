      <path d="M-22 -4 q6 -6 12 0"/><path d="M-6 -8 q6 -6 12 0"/><path d="M10 -8 q6 -6 12 0"/><path d="M26 -4 q6 -6 12 0"/>
      <path d="M-14 6 q6 -6 12 0"/><path d="M2 4 q6 -6 12 0"/><path d="M18 6 q6 -6 12 0"/>

    <linearGradient id="horn" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#C98A2C"/>
      <stop offset="1" stop-color="#FFE3A0"/>
    </linearGradient>
  </defs>
  <rect x="-300" y="-230" width="640" height="420" fill="#3A2A66"/>

  <g id="dragon">

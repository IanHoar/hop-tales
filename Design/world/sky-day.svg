<svg xmlns="http://www.w3.org/2000/svg" width="2340" height="844" viewBox="0 0 2340 844">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FA9DD"/>
      <stop offset="0.3" stop-color="#8CCDEC"/>
      <stop offset="0.55" stop-color="#C6E8F5"/>
      <stop offset="0.8" stop-color="#EAF4EE"/>
      <stop offset="1" stop-color="#EAF6E4"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6D0" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#FFEDB0" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#FFE59A" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFE59A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunDisc" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFFBE6"/>
      <stop offset="0.5" stop-color="#FFE99A"/>
      <stop offset="1" stop-color="#FFC95C"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#F4FAFD"/>
      <stop offset="1" stop-color="#CFE5F2"/>
    </linearGradient>
    <linearGradient id="cloudFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#D9EBF6" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="rays" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="a"><feFuncA type="linear" slope="0.07" intercept="0"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="a" mode="multiply"/>
    </filter>
    <g id="cloudBig">
      <g filter="url(#soft)" opacity="0.35" fill="#4E8FBF" transform="translate(6,22)">
        <circle cx="0" cy="0" r="46"/><circle cx="58" cy="-18" r="62"/><circle cx="126" cy="-2" r="50"/><circle cx="180" cy="18" r="34"/>
        <rect x="-30" y="0" width="240" height="40" rx="20"/>
      </g>
      <g fill="url(#cloud)">
        <circle cx="0" cy="0" r="46"/><circle cx="58" cy="-18" r="62"/><circle cx="126" cy="-2" r="50"/><circle cx="180" cy="18" r="34"/>
        <rect x="-30" y="4" width="240" height="40" rx="20"/>
      </g>
      <g fill="#FFFFFF" opacity="0.9">
        <circle cx="46" cy="-40" r="26"/><circle cx="104" cy="-30" r="22"/>
      </g>
      <path d="M-28 30 C 30 42 130 46 206 30 C 140 52 40 52 -28 30 Z" fill="#B9D8EA" opacity="0.7"/>
    </g>
    <g id="cloudSmall">
      <g filter="url(#soft)" opacity="0.3" fill="#4E8FBF" transform="translate(4,12)">
        <circle cx="0" cy="0" r="24"/><circle cx="34" cy="-10" r="32"/><circle cx="72" cy="2" r="24"/>
        <rect x="-18" y="0" width="112" height="22" rx="11"/>
      </g>
      <g fill="url(#cloudFar)">
        <circle cx="0" cy="0" r="24"/><circle cx="34" cy="-10" r="32"/><circle cx="72" cy="2" r="24"/>
        <rect x="-18" y="2" width="112" height="22" rx="11"/>
      </g>
      <path d="M-16 18 C 20 26 70 28 96 18 C 60 32 10 32 -16 18 Z" fill="#B9D8EA" opacity="0.6"/>
    </g>
  </defs>

  <g filter="url(#grain)">
  <rect width="2340" height="844" fill="url(#sky)"/>

  <g opacity="0.55" filter="url(#softer)" fill="#FFFFFF">
    <ellipse cx="400" cy="560" rx="700" ry="90"/>
    <ellipse cx="1500" cy="600" rx="900" ry="80"/>
  </g>

  <g filter="url(#rays)" opacity="0.32" fill="#FFF3C0">
    <path d="M316 118 L -200 640 L -60 700 Z"/>
    <path d="M316 118 L 120 720 L 260 740 Z"/>
    <path d="M316 118 L 520 760 L 660 720 Z"/>
    <path d="M316 118 L 900 640 L 940 520 Z"/>
    <path d="M316 118 L 1000 300 L 960 200 Z"/>
  </g>

  <circle cx="316" cy="118" r="260" fill="url(#sunGlow)"/>
  <circle cx="316" cy="118" r="44" fill="url(#sunDisc)"/>
  <circle cx="316" cy="118" r="44" fill="none" stroke="#FFF8DC" stroke-width="6" opacity="0.8"/>
  <circle cx="316" cy="118" r="62" fill="none" stroke="#FFF1B8" stroke-width="2" opacity="0.35"/>

  <g opacity="0.75" transform="translate(1180,120) scale(0.7)"><use href="#cloudSmall"/></g>
  <g opacity="0.7" transform="translate(1820,200) scale(0.6)"><use href="#cloudSmall"/></g>
  <g opacity="0.8" transform="translate(720,230) scale(0.55)"><use href="#cloudSmall"/></g>
  <g opacity="0.8" transform="translate(2100,90) scale(0.8)"><use href="#cloudSmall"/></g>
  <g opacity="0.7" transform="translate(30,232) scale(0.5)"><use href="#cloudSmall"/></g>

  <g transform="translate(70,150) scale(0.62)"><use href="#cloudBig"/></g>
  <g transform="translate(560,110) scale(0.9)"><use href="#cloudBig"/></g>
  <g transform="translate(1380,150) scale(0.75)"><use href="#cloudBig"/></g>
  <g transform="translate(1940,230) scale(0.55)"><use href="#cloudBig"/></g>
  <g transform="translate(236,214) scale(0.42)"><use href="#cloudSmall"/></g>

  <g stroke="#2E3A55" stroke-width="2.2" stroke-linecap="round" opacity="0.45" fill="none">
    <path d="M186 120 q7 -7 14 0"/><path d="M200 120 q7 -7 14 0"/>
    <path d="M154 148 q5 -5 10 0"/><path d="M164 148 q5 -5 10 0"/>
    <path d="M226 138 q4 -4 8 0"/><path d="M234 138 q4 -4 8 0"/>
    <path d="M1010 160 q7 -7 14 0"/><path d="M1024 160 q7 -7 14 0"/>
    <path d="M1060 190 q5 -5 10 0"/><path d="M1070 190 q5 -5 10 0"/>
    <path d="M1650 120 q6 -6 12 0"/><path d="M1662 120 q6 -6 12 0"/>
  </g>

  </g>
</svg>

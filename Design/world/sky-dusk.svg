<svg xmlns="http://www.w3.org/2000/svg" width="2340" height="844" viewBox="0 0 2340 844">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F0D2A"/>
      <stop offset="0.25" stop-color="#241C4E"/>
      <stop offset="0.45" stop-color="#4A2F72"/>
      <stop offset="0.6" stop-color="#8A4478"/>
      <stop offset="0.74" stop-color="#D0603F"/>
      <stop offset="0.86" stop-color="#F29A4A"/>
      <stop offset="1" stop-color="#F8C56E"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF4D6" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#F6E3C0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F6E3C0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonDisc" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFBEE"/>
      <stop offset="0.6" stop-color="#F7E9C6"/>
      <stop offset="1" stop-color="#D9C39A"/>
    </radialGradient>
    <linearGradient id="wisp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A4E9A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8C5DAA" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7A4E9A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wispWarm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F08A5A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F7A46A" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F08A5A" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="twinkle" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="13" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="a"><feFuncA type="linear" slope="0.09" intercept="0"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="a" mode="multiply"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
  <rect width="2340" height="844" fill="url(#sky)"/>

  <g opacity="0.7" filter="url(#softer)">
    <ellipse cx="500" cy="380" rx="600" ry="70" fill="#5A3A86"/>
    <ellipse cx="1500" cy="330" rx="800" ry="80" fill="#4A2E74"/>
  </g>
  <g filter="url(#soft)">
    <ellipse cx="400" cy="160" rx="330" ry="14" fill="url(#wisp)"/>
    <ellipse cx="1240" cy="220" rx="420" ry="16" fill="url(#wisp)"/>
    <ellipse cx="1900" cy="150" rx="300" ry="12" fill="url(#wisp)"/>
    <ellipse cx="800" cy="520" rx="500" ry="16" fill="url(#wispWarm)"/>
    <ellipse cx="1700" cy="560" rx="560" ry="18" fill="url(#wispWarm)"/>
  </g>

  <g fill="#FFF6DE">
    <circle cx="40" cy="84" r="2.2"/><circle cx="96" cy="50" r="1.6"/><circle cx="146" cy="104" r="2.4"/>
    <circle cx="204" cy="58" r="1.5"/><circle cx="266" cy="96" r="2.1"/><circle cx="328" cy="56" r="1.7"/>
    <circle cx="362" cy="130" r="2.3"/><circle cx="72" cy="166" r="1.5"/><circle cx="122" cy="212" r="1.8"/>
    <circle cx="18" cy="130" r="1.6"/><circle cx="236" cy="176" r="1.4"/><circle cx="300" cy="150" r="1.3"/>
    <circle cx="176" cy="26" r="1.3"/><circle cx="352" cy="200" r="1.6"/>
    <circle cx="480" cy="70" r="2"/><circle cx="560" cy="130" r="1.5"/><circle cx="640" cy="40" r="2.2"/><circle cx="720" cy="110" r="1.6"/>
    <circle cx="820" cy="60" r="1.9"/><circle cx="900" cy="150" r="1.4"/><circle cx="980" cy="30" r="2"/><circle cx="1060" cy="120" r="1.7"/>
    <circle cx="1140" cy="70" r="2.3"/><circle cx="1220" cy="160" r="1.5"/><circle cx="1300" cy="40" r="1.8"/><circle cx="1380" cy="110" r="2.1"/>
    <circle cx="1460" cy="60" r="1.5"/><circle cx="1540" cy="140" r="2"/><circle cx="1620" cy="30" r="1.6"/><circle cx="1700" cy="100" r="2.2"/>
    <circle cx="1780" cy="170" r="1.4"/><circle cx="1860" cy="50" r="2"/><circle cx="1940" cy="120" r="1.7"/><circle cx="2020" cy="80" r="2.3"/>
    <circle cx="2100" cy="180" r="1.5"/><circle cx="2180" cy="40" r="1.9"/><circle cx="2260" cy="130" r="2.1"/><circle cx="2320" cy="90" r="1.6"/>
    <circle cx="520" cy="230" r="1.3"/><circle cx="1000" cy="240" r="1.4"/><circle cx="1500" cy="250" r="1.2"/><circle cx="2000" cy="240" r="1.3"/>
  </g>
  <g fill="#FFF6DE" opacity="0.9" filter="url(#twinkle)">
    <path d="M300 170 l2.2 4.6 5 .7 -3.6 3.5 .8 5 -4.4 -2.4 -4.4 2.4 .8 -5 -3.6 -3.5 5 -.7 Z"/>
    <path d="M58 232 l1.6 3.4 3.7 .5 -2.7 2.6 .7 3.7 -3.3 -1.8 -3.3 1.8 .7 -3.7 -2.7 -2.6 3.7 -.5 Z"/>
    <path d="M1180 90 l2.4 5 5.4 .8 -3.9 3.8 .9 5.4 -4.8 -2.6 -4.8 2.6 .9 -5.4 -3.9 -3.8 5.4 -.8 Z"/>
    <path d="M1880 150 l2 4.2 4.6 .7 -3.3 3.2 .8 4.6 -4.1 -2.2 -4.1 2.2 .8 -4.6 -3.3 -3.2 4.6 -.7 Z"/>
    <path d="M2240 60 l1.8 3.8 4.1 .6 -3 2.9 .7 4.1 -3.6 -1.9 -3.6 1.9 .7 -4.1 -3 -2.9 4.1 -.6 Z"/>
  </g>

  <circle cx="74" cy="122" r="150" fill="url(#moonGlow)"/>
  <circle cx="74" cy="122" r="34" fill="url(#moonDisc)"/>
  <g fill="#D8C49C" opacity="0.7">
    <circle cx="62" cy="110" r="7"/><circle cx="86" cy="130" r="4.5"/><circle cx="70" cy="138" r="3.4"/><circle cx="88" cy="106" r="2.6"/>
  </g>
  <circle cx="74" cy="122" r="34" fill="none" stroke="#FFF8E6" stroke-width="2" opacity="0.5"/>

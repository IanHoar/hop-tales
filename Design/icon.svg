<?xml version="1.0" encoding="UTF-8"?>
<!--
  App icon: a medieval HT monogram with a sword standing between the letters.

  Full bleed and fully opaque — iOS applies its own mask, so no rounded corners and no alpha.
  Palette is DesignSystem's: duskRoot 1B1738 behind, amber FFB23F and amberDeep E07A22 on the
  hilt, cream FFF8EC on the blade.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2558"/>
      <stop offset="1" stop-color="#14102A"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D2453C"/>
      <stop offset="1" stop-color="#8E2320"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7FAF9C"/>
      <stop offset="0.45" stop-color="#E8F6EE"/>
      <stop offset="1" stop-color="#5E8E7C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD98A"/>
      <stop offset="0.5" stop-color="#FFB23F"/>
      <stop offset="1" stop-color="#E07A22"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>
  <circle cx="512" cy="560" r="368" fill="#3A2F6B" fill-opacity="0.45"/>

  <g stroke="#1A0E20" stroke-width="16" stroke-linejoin="round">
    <path fill="url(#stone)" d="M142 300 H274 L246 348 V486 H354 V348 L326 300 H458 L430 348
      V712 L458 760 H326 L354 712 V574 H246 V712 L274 760 H142 L170 712 V348 Z"/>
    <path fill="url(#stone)" d="M560 300 H888 L866 392 H762 V712 L800 760 H648 L686 712 V392
      H582 Z"/>
  </g>

  <g stroke="#1A0E20" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"
     opacity="0.55" fill="none">
    <path d="M196 392 l30 26 M196 640 l26 -22 M404 470 l-26 24 M812 336 l-28 24 M712 560 l26 22"/>
  </g>

  <g stroke="#1A0E20" stroke-width="16" stroke-linejoin="round">
    <path fill="url(#steel)" d="M512 132 L548 236 V700 H476 V236 Z"/>
    <path fill="url(#gold)" d="M386 682 l40 -34 16 46 h140 l16 -46 40 34 -12 58 q-118 24 -228 0 Z"/>
    <circle cx="512" cy="708" r="21" fill="#3E7BE0"/>
    <rect x="480" y="752" width="64" height="118" rx="16" fill="#6B4A2F"/>
    <circle cx="512" cy="898" r="44" fill="url(#gold)"/>
  </g>

  <g stroke="#1A0E20" stroke-width="10" stroke-linecap="round" opacity="0.7">
    <path d="M486 782 h52 M486 812 h52 M486 842 h52"/>
  </g>
  <path d="M512 250 V660" stroke="#FFF8EC" stroke-width="12" stroke-opacity="0.45"
        stroke-linecap="round"/>
</svg>

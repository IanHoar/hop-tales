# Builds the Android app and runs its JVM tests, on Linux. The workflow starts on every pull
# request so "Android" can be a required check; the build itself is skipped, which reports
# success, unless the pull request touches android/ or the content and art it reads from ios/.
name: Android

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      android: ${{ github.event_name != 'pull_request' || steps.filter.outputs.android == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            android:
              - 'android/**'
              - 'ios/HopTalesPackage/Sources/Content/Resources/**'
              - 'ios/HopTalesPackage/Sources/World/Resources/**'
              - 'ios/HopTalesPackage/Sources/DesignSystem/Resources/**'
              - '.github/workflows/android.yml'

  build:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Test and build
        run: ./gradlew test :app:assembleDebug

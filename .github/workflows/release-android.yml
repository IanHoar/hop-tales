# Ships the Android app to Google Play's internal testing track when a GitHub release is published
# with an Android tag:
#
#   android/v<major>.<minor>.<patch>-<build>       e.g. android/v1.0.0-1
#
# iOS releases from ios/v… tags through Xcode Cloud, so a release with any other tag skips this
# workflow's job quietly. Run it by hand (workflow_dispatch) with a tag to re-run a release.
# docs/google-play.md has the setup and the version code scheme.
name: Release Android

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to ship, e.g. android/v1.0.0-1
        required: true

concurrency:
  group: release-android
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    if: startsWith(github.event.release.tag_name || inputs.tag, 'android/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check the tag
        working-directory: .
        run: |
          if ! printf '%s' "$TAG" | grep -qE '^android/v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$'; then
            echo "::error::The tag \"$TAG\" is not an Android release version. Android release tags are android/v<major>.<minor>.<patch>-<build>, e.g. android/v1.0.0-1. Delete the tag and the release, then publish it again with a name of that shape."
            exit 1
          fi
          echo "Releasing $TAG."

      - name: Check the secrets
        working-directory: .
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          ANDROID_UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          ANDROID_UPLOAD_ALIAS: ${{ secrets.ANDROID_UPLOAD_ALIAS }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=""
          for name in ANDROID_UPLOAD_KEYSTORE ANDROID_UPLOAD_PASSWORD ANDROID_UPLOAD_ALIAS PLAY_SERVICE_ACCOUNT_JSON; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. docs/google-play.md, \"Releasing from CI\", has the setup."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode the upload key and the service account
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"

      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            RELEASE_BODY=$(gh release view "$TAG" --json body --jq .body)
            export RELEASE_BODY
          fi
          notes=app/src/main/play/release-notes/en-US/default.txt
          mkdir -p "$(dirname "$notes")"
          python3 - "$notes" <<'PYTHON'
          import os, sys
          tag = os.environ["TAG"]
          body = os.environ.get("RELEASE_BODY", "").replace("\r\n", "\n").strip()
          body = body or f"Hop Tales {tag.removeprefix('android/v')}"
          if len(body) > 500:
              body = body[:499].rstrip() + "…"
          open(sys.argv[1], "w", encoding="utf-8").write(body + "\n")
          PYTHON
          cat "$notes"

      - name: Build the bundle
        env:
          ORG_GRADLE_PROJECT_HOPTALES_UPLOAD_STORE: ${{ runner.temp }}/upload.jks
          ORG_GRADLE_PROJECT_HOPTALES_UPLOAD_ALIAS: ${{ secrets.ANDROID_UPLOAD_ALIAS }}
          ORG_GRADLE_PROJECT_HOPTALES_UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
        run: ./gradlew :app:bundleRelease -PreleaseTag="$TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload to internal testing
        env:
          ORG_GRADLE_PROJECT_HOPTALES_UPLOAD_STORE: ${{ runner.temp }}/upload.jks
          ORG_GRADLE_PROJECT_HOPTALES_UPLOAD_ALIAS: ${{ secrets.ANDROID_UPLOAD_ALIAS }}
          ORG_GRADLE_PROJECT_HOPTALES_UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          ORG_GRADLE_PROJECT_HOPTALES_PLAY_CREDENTIALS: ${{ runner.temp }}/play-service-account.json
        run: ./gradlew :app:publishReleaseBundle -PreleaseTag="$TAG"

      - name: Remove the upload key and the service account
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/play-service-account.json"
